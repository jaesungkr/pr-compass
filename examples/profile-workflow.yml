name: Update public PR status
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pr-compass-profile
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: jaesungkr/pr-compass@ccc2e38b77f7d6e9af8a3b2216ca31b21737e88f
        with:
          username: ${{ github.repository_owner }}
          limit: '5'
          language: en
          include-own: 'false'
          token: ${{ github.token }}
      - name: Commit the README and generated cards
        shell: bash
        run: |
          git add -- README.md assets/pr-compass
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "docs: update public PR status"
          git push
