name: PR Compass
description: Update a marked README block with public GitHub PR status, reviews, and HEAD checks.
author: Jaesung Park
branding:
  icon: git-pull-request
  color: green
inputs:
  username:
    description: GitHub username whose public PRs to display
    required: true
  readme:
    description: Existing README with exactly one PR-COMPASS marker pair
    default: README.md
  limit:
    description: Maximum PRs shown per category (1–20)
    default: '5'
  language:
    description: Output language (en or ko)
    default: en
  include-own:
    description: Include repositories owned by username (including own forks); organizations remain included either way
    default: 'false'
  token:
    description: Optional built-in GitHub token for API rate limits; do not use a personal access token
    default: ${{ github.token }}
runs:
  using: composite
  steps:
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: '22'
        package-manager-cache: false
    - name: Update marked PR status block
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        INPUT_USERNAME: ${{ inputs.username }}
        INPUT_README: ${{ inputs.readme }}
        INPUT_LIMIT: ${{ inputs.limit }}
        INPUT_INCLUDE_OWN: ${{ inputs.include-own }}
        INPUT_LANGUAGE: ${{ inputs.language }}
        GITHUB_TOKEN: ${{ inputs.token }}
      run: node "$ACTION_PATH/src/cli.mjs"
